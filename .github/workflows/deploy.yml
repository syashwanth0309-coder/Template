
name: Deploy Django Portfolio

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy portfolio on EC2
        shell: bash
        run: |
          set -e

          cd /home/ec2-user/Template

          echo "Updating application code..."
          git pull --ff-only origin main

          echo "Checking Django configuration..."
          .venv/bin/python manage.py check

          echo "Collecting static files..."
          .venv/bin/python manage.py collectstatic --noinput

          echo "Publishing static files..."
          sudo cp -a /home/ec2-user/Template/staticfiles/. /var/www/portfolio/static/

          echo "Restarting Gunicorn..."
          sudo systemctl restart portfolio

          echo "Checking application service..."
          sudo systemctl is-active --quiet portfolio

          echo "Checking website response..."
          curl --fail --silent --show-error \
            --max-time 20 \
            -o /dev/null \
            -w "Website HTTP status: %{http_code}\n" \
            -H "Host: 13.60.33.8" \
            http://127.0.0.1/
